{% load static %}
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Login - AbasteceAi</title>
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body>
    <div class="container">
        <header>
            <h1>AbasteceAi</h1>
        </header>

        <h2 style="text-align:center; margin-bottom:20px;">Entrar na conta</h2>

        <form method="post">
            {% csrf_token %}
            <div class="form-grupo">
                <label for="email">E-mail</label>
                <input type="email" id="email" name="email" placeholder="seu@email.com">
            </div>

            <div class="form-grupo">
                <label for="senha">Senha</label>
                <input type="password" id="senha" name="senha" placeholder="Digite sua senha">
            </div>

            <button type="submit" class="botao">Entrar</button>
            <a href="{% url 'home' %}" class="botao botao-secundario">Criar conta</a>
        </form>

        <p class="link-rodape">
            <a href="#">Esqueci minha senha</a>
        </p>
    </div>
</body>
</html>

<!doctype html>
<html lang="pt-BR">
  <head>
    <title>Dashboard de Preços</title>
    <!-- Required meta tags -->
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">

    <!-- Bootstrap CSS -->
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
      </head>
<body>
  <header class="topbar">
    <button class="back-btn" aria-label="Voltar">
      <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5"/><path d="m12 19-7-7 7-7"/></svg>
    </button>
    <div class="title">
      <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#FFD60A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3v18h18"/><rect x="7" y="12" width="3" height="6"/><rect x="12" y="8" width="3" height="10"/><rect x="17" y="5" width="3" height="13"/></svg>
      <h1>Dashboard de Preços</h1>
    </div>
  </header>

  <main class="container">
    
    <div class="period-filters">
      <button class="period-btn">7 dias</button>
      <button class="period-btn">30 dias</button>
      <button class="period-btn active">Todos</button>
    </div>

    <!-- ABAS -->
    <div class="tabs" role="tablist">
      <button class="tab active" role="tab" aria-selected="true">Evolução</button>
      <button class="tab" role="tab" aria-selected="false">Postos</button>
      <button class="tab" role="tab" aria-selected="false">Área</button>
    </div>

    
    <section class="card chart-card">
      <h2 class="card-title">Evolução de Preços por Combustível</h2>
      <div class="chart-empty">
        <span>Sem dados suficientes</span>
      </div>
    </section>
  </main>
</body>
</html>
    
  </body>
</html>
